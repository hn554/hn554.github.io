<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="청년교회 네컷">
<title>꿈꾸는 청년교회 네컷</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(160deg,#1a2a1a 0%,#2d4a2d 60%,#1a2a1a 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;gap:1.2rem}
h1{font-size:22px;font-weight:800;color:#fff;text-align:center;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.subtitle{font-size:12px;color:rgba(255,255,255,.65);text-align:center;margin-top:4px;letter-spacing:2px}

/* 프레임 선택 */
.frames-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.frame-btn{border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 12px;cursor:pointer;background:rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.7);transition:all .2s;min-width:86px;text-align:center;backdrop-filter:blur(8px)}
.frame-btn.f0.active{border-color:#a8c87a;background:rgba(168,200,122,.15);color:#a8c87a;box-shadow:0 0 16px rgba(168,200,122,.3)}
.frame-btn.f1.active{border-color:#e8c87a;background:rgba(232,200,122,.15);color:#e8c87a;box-shadow:0 0 16px rgba(232,200,122,.3)}
.frame-btn.f2.active{border-color:#c8c8c8;background:rgba(200,200,200,.12);color:#e0e0e0;box-shadow:0 0 16px rgba(200,200,200,.25)}
.frame-icon{font-size:22px;margin-bottom:4px}
.frame-name{font-size:13px;font-weight:700}
.frame-sub{font-size:10px;opacity:.65;margin-top:2px}

/* 카메라 */
.cam-wrap{position:relative;width:100%;max-width:400px}
video{width:100%;border-radius:16px;display:block;background:#000;aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1)}
.timer-big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:90px;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(255,255,255,.9),0 2px 16px rgba(0,0,0,.5);display:none;pointer-events:none}
.flash-overlay{position:absolute;inset:0;border-radius:16px;background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.flash-overlay span{font-size:14px;font-weight:700;color:#333}
.progress-row{display:flex;gap:8px;justify-content:center}
.pdot{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.35);background:rgba(255,255,255,.05)}
.pdot.done{border-color:#a8c87a;background:rgba(168,200,122,.2);color:#a8c87a;font-weight:700}
.pdot.cur{border-color:#fff;color:#fff;font-weight:700;box-shadow:0 0 10px rgba(255,255,255,.5)}
.step-label{font-size:13px;color:rgba(255,255,255,.7);text-align:center}

/* 버튼 */
.btn{width:100%;max-width:300px;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#a8c87a,#6ea840);color:#fff;box-shadow:0 4px 20px rgba(110,168,64,.4)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(110,168,64,.5)}
.btn-primary:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.35);cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.2)}

/* 선택 */
.shots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:400px}
.shot-thumb{border-radius:10px;border:2.5px solid rgba(255,255,255,.1);cursor:pointer;aspect-ratio:4/3;object-fit:cover;width:100%;transition:all .2s}
.shot-thumb.selected{border-color:#a8c87a;box-shadow:0 0 14px rgba(168,200,122,.5)}
.select-hint{font-size:13px;color:rgba(255,255,255,.6);text-align:center}

/* 결과 */
#result-canvas{width:100%;max-width:400px;border-radius:16px;display:block;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.qr-wrap{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:1.2rem;text-align:center;width:100%;max-width:400px}
.qr-wrap p{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px}
#qr-canvas{border-radius:8px}
.btn-row{display:flex;gap:8px;width:100%;max-width:400px}
.btn-half{flex:1;padding:13px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;transition:all .2s}
.btn-half.primary{background:linear-gradient(135deg,#a8c87a,#6ea840);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(110,168,64,.4)}
.section{display:none;flex-direction:column;align-items:center;gap:1rem;width:100%}
.section.active{display:flex}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:1.4rem;width:100%;max-width:400px}
</style>
</head>
<body>

<div style="text-align:center;padding-top:.3rem">
  <div style="font-size:30px;margin-bottom:6px">🎉</div>
  <h1>꿈꾸는 청년교회 네컷</h1>
  <p class="subtitle">✦ 다시, 예배 · 2026 수련회 ✦</p>
</div>

<!-- 프레임 선택 -->
<div id="s-frame" class="section active">
  <div class="card">
    <p style="font-size:14px;font-weight:700;color:#fff;text-align:center;margin-bottom:1rem">프레임을 선택하세요</p>
    <div class="frames-row">
      <div class="frame-btn f0 active" onclick="selectFrame(0,this)">
        <div class="frame-icon">🌿</div>
        <div class="frame-name">초록 들판</div>
        <div class="frame-sub">구름·양 일러스트</div>
      </div>
      <div class="frame-btn f1" onclick="selectFrame(1,this)">
        <div class="frame-icon">🌟</div>
        <div class="frame-name">컬러 팝</div>
        <div class="frame-sub">베이지·스티커</div>
      </div>
      <div class="frame-btn f2" onclick="selectFrame(2,this)">
        <div class="frame-icon">🎞</div>
        <div class="frame-name">필름</div>
        <div class="frame-sub">다크·필름 테두리</div>
      </div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="startShooting()">📷 촬영 시작</button>
</div>

<!-- 촬영 -->
<div id="s-shoot" class="section">
  <p class="step-label" id="shoot-label">카메라 연결 중...</p>
  <div class="progress-row" id="prog"></div>
  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="timer-big" id="timer"></div>
    <div class="flash-overlay" id="flash">
      <div style="font-size:40px">📸</div>
      <span id="flash-msg">찰칵!</span>
    </div>
  </div>
  <button class="btn btn-secondary" onclick="cancelShoot()">취소</button>
</div>

<!-- 컷 선택 -->
<div id="s-select" class="section">
  <p style="font-size:15px;font-weight:700;color:#fff">✨ 4컷을 선택하세요</p>
  <p class="select-hint" id="hint">0 / 4 선택됨</p>
  <div class="shots-grid" id="grid"></div>
  <button class="btn btn-primary" id="make-btn" onclick="makeResult()" disabled>완성본 만들기</button>
  <button class="btn btn-secondary" onclick="goFrame()">↩ 다시 찍기</button>
</div>

<!-- 결과 -->
<div id="s-result" class="section">
  <p style="font-size:15px;font-weight:700;color:#fff">🎉 완성됐어요!</p>
  <canvas id="result-canvas"></canvas>
  <div class="qr-wrap">
    <p>💾 저장하기 버튼을 눌러 사진을 받으세요</p>
    <canvas id="qr-canvas" width="140" height="140"></canvas>
  </div>
  <div class="btn-row">
    <button class="btn-half primary" onclick="downloadImg()">💾 저장하기</button>
    <button class="btn-half" onclick="restart()">🔄 처음으로</button>
  </div>
</div>

<script>
// ── 프레임 정의 ─────────────────────────────────────────────
const FRAMES = [

  // 0: 초록 들판 (TLMC 첫번째 스타일)
  {
    name: '초록 들판',
    draw: function(ctx, W, H, HEAD, FOOT, BW, photos, photoCoords) {
      // 초록 배경
      ctx.fillStyle = '#4a6741';
      ctx.fillRect(0, 0, W, H);

      // 하단 언덕
      ctx.fillStyle = '#3a5530';
      ctx.beginPath();
      ctx.ellipse(W/2, H+10, W*0.8, 60, 0, 0, Math.PI*2);
      ctx.fill();

      // 구름들 (손그림 느낌)
      drawCloud(ctx, 30, HEAD-10, 40, '#e8e0c8', 0.7);
      drawCloud(ctx, W-50, HEAD-5, 35, '#e8e0c8', 0.6);
      drawCloud(ctx, W-80, HEAD+30, 28, '#d4c8a8', 0.5);
      drawCloud(ctx, 15, HEAD+40, 25, '#d4c8a8', 0.5);

      // 주황 구름
      drawCloud(ctx, W-30, H-FOOT-40, 22, '#e8783a', 0.8);
      drawCloud(ctx, 20, H-FOOT-30, 20, '#e8783a', 0.7);

      // 양 일러스트들
      drawSheep(ctx, W-28, H-FOOT-10, 18, '#f0e8c8');
      drawSheep(ctx, 22, H-FOOT-8, 14, '#f0e8c8');
      drawSheep(ctx, W/2+40, H-FOOT+5, 12, '#f0e8c8');

      // 상단 타이틀 박스
      ctx.fillStyle = '#7ab84a';
      roundRect(ctx, W/2-85, 10, 170, 38, 18);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 15px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ROMANS 12:1', W/2, 34);

      // 사진
      photos();

      // 하단 텍스트
      ctx.fillStyle = '#f0e040';
      ctx.font = '800 20px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('꿈꾸는 청년교회', W/2, H-FOOT+22);
      ctx.fillStyle = '#fff';
      ctx.font = '600 12px -apple-system,sans-serif';
      ctx.fillText('다시, 예배  ·  2026 수련회', W/2, H-FOOT+40);
      ctx.font = '400 10px -apple-system,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      const d=new Date();
      ctx.fillText(`${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`, W/2, H-FOOT+56);
    },
    photoBorder: '#fff',
    photoShadow: 'rgba(0,0,0,0.25)'
  },

  // 1: 컬러 팝 (TLMC 두번째 스타일)
  {
    name: '컬러 팝',
    draw: function(ctx, W, H, HEAD, FOOT, BW, photos) {
      // 베이지 배경
      ctx.fillStyle = '#f5f0e8';
      ctx.fillRect(0, 0, W, H);

      // 하단 초록 반원
      ctx.fillStyle = '#4a9a5a';
      ctx.beginPath();
      ctx.ellipse(W/2, H+20, W*0.7, 55, 0, 0, Math.PI*2);
      ctx.fill();

      // 컬러 뱃지들
      // 2026 뱃지 (왼쪽 상단)
      ctx.fillStyle = '#c03030';
      ctx.beginPath();ctx.arc(32, HEAD-18, 24, 0, Math.PI*2);ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 11px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('2026', 32, HEAD-14);

      // 양 뱃지 (오른쪽)
      ctx.fillStyle = '#e8a830';
      ctx.beginPath();ctx.arc(W-32, HEAD+30, 22, 0, Math.PI*2);ctx.fill();
      ctx.font = '500 16px serif';
      ctx.fillText('🐑', W-32, HEAD+36);

      // 왼쪽 양 뱃지 (빨강)
      ctx.fillStyle = '#d03030';
      ctx.beginPath();ctx.arc(28, H/2+10, 22, 0, Math.PI*2);ctx.fill();
      ctx.font = '500 14px serif';
      ctx.fillText('🐑', 28, H/2+16);

      // TEAM LUKE 스티커
      ctx.fillStyle = '#2a7a3a';
      roundRect(ctx, W-80, HEAD+65, 74, 20, 4);ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 9px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('TEAM LUKE', W-43, HEAD+79);
      ctx.fillStyle = '#6a3a1a';
      roundRect(ctx, W-80, HEAD+87, 74, 18, 4);ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 8px -apple-system,sans-serif';
      ctx.fillText('MISSION CAMP', W-43, HEAD+100);

      // ROMANS 12:1 스티커
      ctx.fillStyle = '#60b0e0';
      roundRect(ctx, 8, H-FOOT-55, 90, 22, 4);ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 9px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ROMANS 12:1', 53, H-FOOT-40);

      // 사진
      photos();

      // 하단 컬러 원형 로고
      const colors=['#d03030','#f0b030','#2a7a3a','#3060b0'];
      const labels=['꿈','꾸','는','C'];
      const startX=W/2-50;
      colors.forEach((c,i)=>{
        ctx.fillStyle=c;
        ctx.beginPath();ctx.arc(startX+i*34, H-FOOT+30, 16, 0, Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='700 14px -apple-system,sans-serif';
        ctx.textAlign='center';
        ctx.fillText(labels[i], startX+i*34, H-FOOT+35);
      });
      ctx.fillStyle='#333';
      ctx.font='500 10px -apple-system,sans-serif';
      ctx.textAlign='center';
      ctx.fillText('다시, 예배 · 2026 수련회', W/2, H-18);
    },
    photoBorder: '#fff',
    photoShadow: 'rgba(0,0,0,0.15)'
  },

  // 2: 필름 (TLMC 세번째 스타일)
  {
    name: '필름',
    draw: function(ctx, W, H, HEAD, FOOT, BW, photos) {
      // 다크 배경
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, W, H);

      // 사진 먼저
      photos();

      // 세로 텍스트 (왼쪽)
      ctx.save();
      ctx.translate(14, H/2);
      ctx.rotate(-Math.PI/2);
      ctx.fillStyle = '#fff';
      ctx.font = '600 10px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '2px';
      ctx.fillText('꿈꾸는 청년교회  ·  TEAM YOUTH', 0, 0);
      ctx.restore();

      // 세로 텍스트 (오른쪽)
      ctx.save();
      ctx.translate(W-14, H/2);
      ctx.rotate(Math.PI/2);
      ctx.fillStyle = '#fff';
      ctx.font = '600 10px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('다시, 예배  ·  2026 수련회', 0, 0);
      ctx.restore();

      // 필름 스프로킷 홀 (각 사진 아래 필름 띠)
      // 사진 1,2 사이 필름 띠
      const filmY1 = HEAD + 134;
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(BW, filmY1, W-BW*2, 22);
      for(let x=BW+8; x<W-BW-8; x+=18){
        ctx.fillStyle = '#111';
        roundRect(ctx, x, filmY1+4, 10, 14, 2);ctx.fill();
        ctx.strokeStyle='#3a3a3a';ctx.lineWidth=.5;
        roundRect(ctx, x, filmY1+4, 10, 14, 2);ctx.stroke();
      }
      // 필름 숫자
      ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.font='400 8px monospace';
      ctx.textAlign='left';
      ctx.fillText('▶  26', BW+12, filmY1+15);
      ctx.textAlign='right';
      ctx.fillText('▶  1', W-BW-12, filmY1+15);

      // 사진 2,3 사이
      const filmY2 = HEAD + 134 + 22 + 134;
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(BW, filmY2, W-BW*2, 22);
      for(let x=BW+8; x<W-BW-8; x+=18){
        ctx.fillStyle = '#111';
        roundRect(ctx, x, filmY2+4, 10, 14, 2);ctx.fill();
        ctx.strokeStyle='#3a3a3a';ctx.lineWidth=.5;
        roundRect(ctx, x, filmY2+4, 10, 14, 2);ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.font='400 8px monospace';
      ctx.textAlign='left';
      ctx.fillText('▶  26', BW+12, filmY2+15);
      ctx.textAlign='right';
      ctx.fillText('▶  1', W-BW-12, filmY2+15);

      // 상단 텍스트
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.font='600 10px -apple-system,sans-serif';
      ctx.textAlign='left';
      ctx.fillText('TEAM LUKE MISSION CAMP', BW+8, HEAD-8);
      ctx.textAlign='right';
      ctx.fillText('TLMC 2026', W-BW-8, HEAD-8);

      // 하단 로고
      ctx.fillStyle='#fff';
      ctx.font='800 16px -apple-system,sans-serif';
      ctx.textAlign='left';
      ctx.fillText('순복 順服', BW+12, H-FOOT+28);
      ctx.textAlign='right';
      ctx.font='700 11px -apple-system,sans-serif';
      ctx.fillText('TLMC', W-BW-12, H-FOOT+20);
      ctx.font='600 9px -apple-system,sans-serif';
      ctx.fillText('TEAMLUKEMISSIONCAMP', W-BW-12, H-FOOT+32);
      ctx.font='800 13px -apple-system,sans-serif';
      ctx.fillText('2026', W-BW-12, H-FOOT+46);

      // 양 일러스트
      drawSheepOutline(ctx, BW+10, H-FOOT+38, 22, 'rgba(255,255,255,.5)');
      drawSheepOutline(ctx, W-BW-38, H-FOOT+52, 18, 'rgba(255,255,255,.3)');
    },
    photoBorder: 'rgba(255,255,255,0.15)',
    photoShadow: 'rgba(0,0,0,0.5)'
  }
];

// ── 유틸 ─────────────────────────────────────────────────────
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}
  else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);}
  ctx.closePath();
}

function drawCloud(ctx,x,y,r,color,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.9,y+r*0.2,r*0.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x-r*0.7,y+r*0.3,r*0.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawSheep(ctx,x,y,r,color){
  ctx.save();ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.7,y+r*0.3,r*0.6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x-r*0.5,y+r*0.4,r*0.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a3020';
  ctx.beginPath();ctx.ellipse(x+r*1.1,y+r*1.0,r*0.25,r*0.55,0.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawSheepOutline(ctx,x,y,r,color){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.fillStyle='transparent';
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(x+r*0.8,y+r*0.2,r*0.6,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x+r*1.2,y+r*0.9,r*0.2,r*0.5,0.2,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function p2(n){return String(n).padStart(2,'0');}

// ── 상태 ─────────────────────────────────────────────────────
let selFrame=0,stream=null,shots=[],selShots=[],cnt=0;
const TOTAL=6,CD=5;

function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function selectFrame(i,el){
  selFrame=i;
  document.querySelectorAll('.frame-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

async function startShooting(){
  shots=[];selShots=[];cnt=0;
  show('s-shoot');updateProg();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    document.getElementById('video').srcObject=stream;
    document.getElementById('shoot-label').textContent='😊 준비되면 카메라를 바라보세요!';
    await wait(1200);loop();
  }catch(e){document.getElementById('shoot-label').textContent='카메라 권한을 허용해 주세요.';}
}

async function loop(){
  if(cnt>=TOTAL){stopStream();showSelect();return;}
  document.getElementById('shoot-label').textContent=`${cnt+1} / ${TOTAL} 촬영 중...`;
  const t=document.getElementById('timer');
  for(let i=CD;i>0;i--){t.style.display='block';t.textContent=i;await wait(1000);}
  t.style.display='none';
  capture();cnt++;updateProg();
  const fl=document.getElementById('flash');
  fl.style.display='flex';
  document.getElementById('flash-msg').textContent=`${cnt} / ${TOTAL} 완료! 🎉`;
  await wait(700);fl.style.display='none';
  if(cnt<TOTAL)await wait(400);
  loop();
}

function capture(){
  const v=document.getElementById('video');
  const c=document.createElement('canvas');
  c.width=v.videoWidth||640;c.height=v.videoHeight||480;
  const ctx=c.getContext('2d');
  // 거울모드: CSS는 반전, 저장은 다시 반전해서 정방향으로
  ctx.save();ctx.scale(-1,1);ctx.drawImage(v,-c.width,0);ctx.restore();
  shots.push(c.toDataURL('image/jpeg',0.92));
}

function updateProg(){
  const b=document.getElementById('prog');b.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='pdot'+(i<cnt?' done':i===cnt?' cur':'');
    d.textContent=i+1;b.appendChild(d);
  }
}

function showSelect(){
  show('s-select');
  const g=document.getElementById('grid');g.innerHTML='';
  shots.forEach((src,i)=>{
    const img=document.createElement('img');
    img.src=src;img.className='shot-thumb';
    img.onclick=()=>toggle(i,img);
    g.appendChild(img);
  });
  selShots=[];
  document.getElementById('hint').textContent='0 / 4 선택됨';
  document.getElementById('make-btn').disabled=true;
}

function toggle(i,img){
  const p=selShots.indexOf(i);
  if(p>=0){selShots.splice(p,1);img.classList.remove('selected');}
  else if(selShots.length<4){selShots.push(i);img.classList.add('selected');}
  document.getElementById('hint').textContent=`${selShots.length} / 4 선택됨`;
  document.getElementById('make-btn').disabled=selShots.length!==4;
}

function makeResult(){
  const f=FRAMES[selFrame];
  const rc=document.getElementById('result-canvas');

  // 레이아웃 계산
  const W=440;
  const BW=selFrame===2?20:0; // 필름은 사이드 여백
  const PW=Math.floor((W-BW*2-12)/2)-8;
  const PH=Math.floor(PH_from_PW(PW));
  const GAP=10;
  const HEAD=selFrame===2?22:80;
  const FOOT=selFrame===2?70:65;

  // 필름 모드는 필름띠 높이 포함
  const filmH=selFrame===2?22:0;
  const H=HEAD+10+(PH+GAP+filmH)*2-GAP+10+FOOT;

  rc.width=W;rc.height=H;
  const ctx=rc.getContext('2d');

  // 사진 로딩 후 프레임 그리기
  const imgObjs=selShots.slice(0,4).map(si=>{
    return new Promise(res=>{
      const img=new Image();
      img.onload=()=>res(img);
      img.src=shots[si];
    });
  });

  Promise.all(imgObjs).then(imgs=>{
    // 사진 그리기 함수
    const drawPhotos=()=>{
      imgs.forEach((img,i)=>{
        const col=i%2,row=Math.floor(i/2);
        const sx=BW+8+(PW+GAP)*col;
        const filmOffset=selFrame===2?(row*filmH):0;
        const sy=HEAD+10+(PH+GAP)*row+filmOffset;

        ctx.shadowColor=f.photoShadow;
        ctx.shadowBlur=selFrame===2?8:12;
        ctx.shadowOffsetY=selFrame===2?2:4;

        ctx.save();
        ctx.beginPath();
        roundRect(ctx,sx,sy,PW,PH,selFrame===2?0:6);
        ctx.clip();
        const sc=Math.max(PW/img.width,PH/img.height);
        const iw=PW/sc,ih=PH/sc;
        ctx.drawImage(img,(img.width-iw)/2,(img.height-ih)/2,iw,ih,sx,sy,PW,PH);
        ctx.restore();

        ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

        if(f.photoBorder){
          ctx.strokeStyle=f.photoBorder;
          ctx.lineWidth=selFrame===2?1:1.5;
          ctx.beginPath();
          roundRect(ctx,sx,sy,PW,PH,selFrame===2?0:6);
          ctx.stroke();
        }
      });
    };

    f.draw(ctx,W,H,HEAD,FOOT,BW,drawPhotos);
    show('s-result');
    makeQR();
  });
}

function PH_from_PW(pw){return Math.round(pw*3/4);}

function makeQR(){
  const qc=document.getElementById('qr-canvas');
  const ctx=qc.getContext('2d');
  const S=140,M=21,cell=Math.floor((S-16)/M),off=Math.floor((S-cell*M)/2);
  const bg=selFrame===2?'#1a1a1a':'#f5f0e8';
  const fg=selFrame===2?'#fff':selFrame===1?'#333':'#3a5530';
  ctx.fillStyle=bg;ctx.fillRect(0,0,S,S);
  let s=12345;
  const pat=[];
  for(let r=0;r<M;r++){pat.push([]);for(let c=0;c<M;c++){s=(s*1103515245+12345)&0x7fffffff;pat[r].push(s%3===0);}}
  ctx.fillStyle=fg;
  for(let r=0;r<M;r++)for(let c=0;c<M;c++)if(pat[r][c])ctx.fillRect(off+c*cell,off+r*cell,cell-1,cell-1);
  [[0,0],[0,14],[14,0]].forEach(([dr,dc])=>{
    ctx.fillStyle=fg;ctx.fillRect(off+dc*cell,off+dr*cell,cell*7,cell*7);
    ctx.fillStyle=bg;ctx.fillRect(off+dc*cell+cell,off+dr*cell+cell,cell*5,cell*5);
    ctx.fillStyle=fg;ctx.fillRect(off+dc*cell+cell*2,off+dr*cell+cell*2,cell*3,cell*3);
  });
  ctx.fillStyle=fg;ctx.font='600 8px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.fillText('꿈꾸는 청년교회',S/2,S-3);
}

function downloadImg(){
  const a=document.createElement('a');
  a.href=document.getElementById('result-canvas').toDataURL('image/jpeg',0.95);
  a.download='꿈꾸는청년교회_네컷.jpg';a.click();
}
function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function cancelShoot(){stopStream();goFrame();}
function goFrame(){show('s-frame');}
function restart(){show('s-frame');}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
