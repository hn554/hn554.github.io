<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="꿈청네컷">
<title>꿈꾸는 청년교회 네컷</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1rem 1rem 3rem;gap:1rem}
h1{font-size:18px;font-weight:700;color:#fff;text-align:center}
.sub{font-size:11px;color:rgba(255,255,255,.5);text-align:center;letter-spacing:1px}
.frame-row{display:flex;gap:10px;overflow-x:auto;width:100%;padding:4px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:center}
.frame-row::-webkit-scrollbar{display:none}
.fcard{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.fcard img{width:88px;height:124px;object-fit:cover;border-radius:10px;border:3px solid transparent;transition:all .2s;display:block;background:#fff}
.fcard.active img{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.flbl{font-size:10px;color:rgba(255,255,255,.5);text-align:center}
.cam-wrap{position:relative;width:100%;max-width:360px}
video{width:100%;border-radius:12px;display:block;background:#000;aspect-ratio:3/4;object-fit:cover;transform:scaleX(-1)}
.timer-big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.8);display:none;pointer-events:none}
.flash{position:absolute;inset:0;border-radius:12px;background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.flash span{font-size:13px;font-weight:700;color:#333}
.prog-row{display:flex;gap:6px;justify-content:center}
.pdot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.3);background:rgba(255,255,255,.04)}
.pdot.done{border-color:#a8d870;background:rgba(168,216,112,.2);color:#a8d870;font-weight:700}
.pdot.cur{border-color:#fff;color:#fff;font-weight:700}
.slbl{font-size:12px;color:rgba(255,255,255,.65);text-align:center}
.btn{width:100%;max-width:280px;padding:13px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;border:none}
.btnp{background:linear-gradient(135deg,#a8d870,#60b030);color:#fff;box-shadow:0 4px 14px rgba(96,176,48,.4)}
.btnp:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.3);cursor:not-allowed;box-shadow:none}
.btns{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.shots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:360px}
.sthumb{border-radius:8px;border:2px solid rgba(255,255,255,.1);cursor:pointer;aspect-ratio:3/4;object-fit:cover;width:100%;transition:all .2s}
.sthumb.sel{border-color:#a8d870;box-shadow:0 0 12px rgba(168,216,112,.5)}
.hint{font-size:12px;color:rgba(255,255,255,.55);text-align:center}
#result-canvas{width:100%;max-width:360px;border-radius:12px;display:block;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.qr-wrap{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:1rem;text-align:center;width:100%;max-width:360px}
.qr-wrap p{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:8px}
.btn-row{display:flex;gap:8px;width:100%;max-width:360px}
.bth{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff}
.bth.p{background:linear-gradient(135deg,#a8d870,#60b030);color:#fff;border-color:transparent}
.sec{display:none;flex-direction:column;align-items:center;gap:.9rem;width:100%}
.sec.on{display:flex}
</style>
</head>
<body>
<div style="text-align:center;padding-top:.2rem">
  <div style="font-size:24px;margin-bottom:4px">📸</div>
  <h1>꿈꾸는 청년교회 네컷</h1>
  <p class="sub">✦ 다시, 예배 · 2026.08.15-17 ✦</p>
</div>

<div id="s-frame" class="sec on">
  <p style="font-size:13px;font-weight:600;color:rgba(255,255,255,.8)">프레임을 선택하세요</p>
  <div class="frame-row" id="frame-row"></div>
  <button class="btn btnp" onclick="startShooting()">📷 촬영 시작</button>
</div>

<div id="s-shoot" class="sec">
  <p class="slbl" id="slbl">카메라 연결 중...</p>
  <div class="prog-row" id="prog"></div>
  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="timer-big" id="timer"></div>
    <div class="flash" id="flash">
      <div style="font-size:36px">📸</div>
      <span id="flash-msg">찰칵!</span>
    </div>
  </div>
  <button class="btn btns" onclick="cancelShoot()">취소</button>
</div>

<div id="s-select" class="sec">
  <p style="font-size:14px;font-weight:700;color:#fff">4컷을 선택하세요</p>
  <p class="hint" id="hint">0 / 4 선택됨</p>
  <div class="shots-grid" id="grid"></div>
  <button class="btn btnp" id="make-btn" onclick="makeResult()" disabled>✨ 완성본 만들기</button>
  <button class="btn btns" onclick="goFrame()">↩ 다시 찍기</button>
</div>

<div id="s-result" class="sec">
  <p style="font-size:14px;font-weight:700;color:#fff">🎉 완성됐어요!</p>
  <canvas id="result-canvas"></canvas>
  <div class="qr-wrap">
    <p>저장 버튼을 누르거나 이미지를 길게 누르세요 💾</p>
  </div>
  <div class="btn-row">
    <button class="bth p" onclick="saveImg()">💾 사진 저장</button>
    <button class="bth" onclick="restart()">🔄 처음으로</button>
  </div>
</div>

const FRAME_NAMES=['크림 도트','Worship Again','꿈청 낙서','보라 글로우'];

// 프레임 썸네일
let selFrame=0;
const row=document.getElementById('frame-row');
FRAMES_B64.forEach((src,i)=>{
  const card=document.createElement('div');
  card.className='fcard'+(i===0?' active':'');
  const img=document.createElement('img');
  img.src=src;
  const lbl=document.createElement('div');
  lbl.className='flbl';lbl.textContent=FRAME_NAMES[i];
  card.append(img,lbl);
  card.onclick=()=>{
    document.querySelectorAll('.fcard').forEach(c=>c.classList.remove('active'));
    card.classList.add('active');selFrame=i;
  };
  row.appendChild(card);
});

let stream=null,shots=[],selShots=[],cnt=0;
const TOTAL=6,CD=5;
function show(id){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}

async function startShooting(){
  shots=[];selShots=[];cnt=0;
  show('s-shoot');updateProg();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    document.getElementById('video').srcObject=stream;
    document.getElementById('slbl').textContent='😊 준비되면 카메라를 바라보세요!';
    await wait(1000);loop();
  }catch(e){document.getElementById('slbl').textContent='카메라 권한을 허용해 주세요.';}
}

async function loop(){
  if(cnt>=TOTAL){stopStream();showSelect();return;}
  document.getElementById('slbl').textContent=`${cnt+1} / ${TOTAL} 촬영 중...`;
  const t=document.getElementById('timer');
  for(let i=CD;i>0;i--){t.style.display='block';t.textContent=i;await wait(1000);}
  t.style.display='none';
  capture();cnt++;updateProg();
  const fl=document.getElementById('flash');
  fl.style.display='flex';
  document.getElementById('flash-msg').textContent=`${cnt} / ${TOTAL} 완료! 🎉`;
  await wait(600);fl.style.display='none';
  if(cnt<TOTAL)await wait(300);
  loop();
}

function capture(){
  const v=document.getElementById('video');
  const c=document.createElement('canvas');
  c.width=v.videoWidth||640;c.height=v.videoHeight||480;
  const ctx=c.getContext('2d');
  ctx.save();ctx.scale(-1,1);ctx.drawImage(v,-c.width,0);ctx.restore();
  shots.push(c.toDataURL('image/jpeg',.92));
}

function updateProg(){
  const b=document.getElementById('prog');b.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='pdot'+(i<cnt?' done':i===cnt?' cur':'');
    d.textContent=i+1;b.appendChild(d);
  }
}

function showSelect(){
  show('s-select');
  const g=document.getElementById('grid');g.innerHTML='';
  shots.forEach((src,i)=>{
    const img=document.createElement('img');
    img.src=src;img.className='sthumb';
    img.onclick=()=>toggle(i,img);
    g.appendChild(img);
  });
  selShots=[];
  document.getElementById('hint').textContent='0 / 4 선택됨';
  document.getElementById('make-btn').disabled=true;
}

function toggle(i,img){
  const p=selShots.indexOf(i);
  if(p>=0){selShots.splice(p,1);img.classList.remove('sel');}
  else if(selShots.length<4){selShots.push(i);img.classList.add('sel');}
  document.getElementById('hint').textContent=`${selShots.length} / 4 선택됨`;
  document.getElementById('make-btn').disabled=selShots.length!==4;
}

function makeResult(){
  const rc=document.getElementById('result-canvas');
  const FW=500, FH=708;
  rc.width=FW; rc.height=FH;
  const ctx=rc.getContext('2d');
  const cells=CELLS[selFrame];

  // 사진 4장 먼저 로드
  const imgPs=selShots.slice(0,4).map(si=>new Promise(res=>{
    const img=new Image();img.onload=()=>res(img);img.src=shots[si];
  }));

  // 프레임 이미지 로드
  const frameImg=new Image();
  const frameLoaded=new Promise(res=>{frameImg.onload=()=>res();frameImg.src=FRAMES_B64[selFrame];});

  Promise.all([...imgPs, frameLoaded]).then(results=>{
    const photos=results.slice(0,4);

    // 1. 흰 배경
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,FW,FH);

    // 2. 사진 4장을 각 칸에 그리기
    photos.forEach((img,i)=>{
      const [px,py,pw,ph]=cells[i];
      ctx.save();
      ctx.beginPath();ctx.rect(px,py,pw,ph);ctx.clip();
      const sc=Math.max(pw/img.width,ph/img.height);
      const iw=pw/sc,ih=ph/sc;
      ctx.drawImage(img,(img.width-iw)/2,(img.height-ih)/2,iw,ih,px,py,pw,ph);
      ctx.restore();
    });

    // 3. 프레임(투명 PNG)을 위에 덮기 — 사진 칸은 투명이라 사진이 보임
    ctx.drawImage(frameImg,0,0,FW,FH);

    show('s-result');
  });
}

function saveImg(){
  const rc=document.getElementById('result-canvas');
  const url=rc.toDataURL('image/jpeg',.95);
  const a=document.createElement('a');
  a.href=url;a.download='꿈청네컷_'+Date.now()+'.jpg';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>{
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:1rem';
    const img=document.createElement('img');
    img.src=url;img.style.cssText='max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px';
    const tip=document.createElement('p');
    tip.style.cssText='color:#fff;font-size:13px;text-align:center;line-height:1.6';
    tip.textContent='이미지를 길게 누르면
사진첩에 저장돼요 ✓';
    const closeBtn=document.createElement('button');
    closeBtn.textContent='✕ 닫기';
    closeBtn.style.cssText='background:rgba(255,255,255,.2);color:#fff;border:none;padding:10px 24px;border-radius:20px;font-size:14px;cursor:pointer;margin-top:4px';
    closeBtn.onclick=()=>document.body.removeChild(overlay);
    overlay.append(img,tip,closeBtn);
    document.body.appendChild(overlay);
  },300);
}

function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function cancelShoot(){stopStream();goFrame();}
function goFrame(){show('s-frame');}
function restart(){show('s-frame');}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
